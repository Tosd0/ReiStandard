name = "amsg-single-user"
main = "worker.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "amsg"
database_id = "<你的 D1 database id>"

# messageType: 'instant' 的起跳器：落库后叫醒它，生成在它的 alarm 里跑（15 分钟预算），
# 请求立刻返回。namespace 随 Worker 上传一起创建，不用预先建资源。
[[durable_objects.bindings]]
name = "AMSG_INSTANT_TICK"
class_name = "AmsgInstantTick"

[[migrations]]
tag = "amsg-instant-tick-v1"
new_sqlite_classes = ["AmsgInstantTick"]

# 部署新版本后，旧实例最多再跑 max_delay 秒才换成新代码（单位秒，默认 300）。
# alarm 的墙钟上限是 15 分钟，设成 900 让正在跑的生成能在旧代码上跑完，不被部署打断。
# 尽力而为：Cloudflare 自己的运行时更新仍可能提前重置实例。
[durable_objects.code_update_strategy]
mode = "deferred"
max_delay = 900

# CF Cron Trigger（5 段：分 时 日 月 周，UTC）。每分钟跑一次定时投递：
[triggers]
crons = ["* * * * *"]
